services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    networks:
      edge:
        ipv4_address: ${CADDY_EDGE_IP:-172.30.250.2}

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SLOT_INTERVAL_MINUTES: ${SLOT_INTERVAL_MINUTES:-30}
      WHATSAPP_WEBHOOK_MAX_BODY_BYTES: ${WHATSAPP_WEBHOOK_MAX_BODY_BYTES:-1048576}
      GOOGLE_ADMIN_AUTH_MAX_BODY_BYTES: ${GOOGLE_ADMIN_AUTH_MAX_BODY_BYTES:-32768}
      EMBEDDED_SIGNUP_ATTEMPT_TTL_SECONDS: ${EMBEDDED_SIGNUP_ATTEMPT_TTL_SECONDS:-600}
      EMBEDDED_SIGNUP_PROCESSING_LEASE_SECONDS: ${EMBEDDED_SIGNUP_PROCESSING_LEASE_SECONDS:-120}
      EMBEDDED_SIGNUP_MAX_BODY_BYTES: ${EMBEDDED_SIGNUP_MAX_BODY_BYTES:-16384}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}

      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_WABA_ID: ${WHATSAPP_WABA_ID:-}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET}
      META_EMBEDDED_SIGNUP_OAUTH_REDIRECT_URI: ${META_EMBEDDED_SIGNUP_OAUTH_REDIRECT_URI:-}
      META_EMBEDDED_SIGNUP_EXCHANGE_GRAPH_VERSION: ${META_EMBEDDED_SIGNUP_EXCHANGE_GRAPH_VERSION:-v25.0}
      META_EMBEDDED_SIGNUP_EXCHANGE_MAX_RESPONSE_BYTES: ${META_EMBEDDED_SIGNUP_EXCHANGE_MAX_RESPONSE_BYTES:-16384}
      META_EMBEDDED_SIGNUP_DEBUG_TOKEN: ${META_EMBEDDED_SIGNUP_DEBUG_TOKEN:-}
      META_EMBEDDED_SIGNUP_DEBUG_GRAPH_VERSION: ${META_EMBEDDED_SIGNUP_DEBUG_GRAPH_VERSION:-v25.0}
      META_EMBEDDED_SIGNUP_DEBUG_MAX_RESPONSE_BYTES: ${META_EMBEDDED_SIGNUP_DEBUG_MAX_RESPONSE_BYTES:-16384}
      META_EMBEDDED_SIGNUP_ASSET_GRAPH_VERSION: ${META_EMBEDDED_SIGNUP_ASSET_GRAPH_VERSION:-v25.0}
      META_EMBEDDED_SIGNUP_ASSET_MAX_RESPONSE_BYTES: ${META_EMBEDDED_SIGNUP_ASSET_MAX_RESPONSE_BYTES:-16384}

      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI}
      GOOGLE_IDENTITY_CLIENT_ID: ${GOOGLE_IDENTITY_CLIENT_ID}
      FRONTEND_URL: ${FRONTEND_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET}
      ADMIN_SESSION_MAX_AGE_SECONDS: ${ADMIN_SESSION_MAX_AGE_SECONDS:-604800}
      ADMIN_SESSION_COOKIE_SECURE: ${ADMIN_SESSION_COOKIE_SECURE:-true}
      ADMIN_SESSION_COOKIE_SAMESITE: ${ADMIN_SESSION_COOKIE_SAMESITE:-none}
      CADDY_EDGE_IP: ${CADDY_EDGE_IP:-172.30.250.2}

    depends_on:
      db:
        condition: service_healthy
    networks:
      edge:
        ipv4_address: ${API_EDGE_IP:-172.30.250.3}
      data:

    command:
      - sh
      - -c
      - >
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000
        --proxy-headers --forwarded-allow-ips "$$CADDY_EDGE_IP"

volumes:
  postgres_data_prod:
  caddy_data:
  caddy_config:

networks:
  # Check this candidate subnet against the Lightsail Docker host before deployment.
  edge:
    driver: bridge
    ipam:
      config:
        - subnet: ${EDGE_SUBNET:-172.30.250.0/29}
  data:
    driver: bridge
    internal: true
