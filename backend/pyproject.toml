[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whatsapp-booking"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<2.1", "asyncpg>=0.29,<1", "alembic>=1.13,<2", "pydantic-settings>=2,<3", "tzdata>=2024.1", "httpx>=0.27,<1", "google-api-python-client", "google-auth-httplib2", "google-auth-oauthlib"]

[project.scripts]
process-reminders = "app.commands.process_reminders:main"

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "httpx>=0.27,<1", "aiosqlite>=0.20,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
